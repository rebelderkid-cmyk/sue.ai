steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--platform', 'linux/amd64',
      '--build-arg', 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}',
      '-t', '${_IMAGE_NAME}',
      '.'
    ]
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_NAME}']
substitutions:
  _NEXT_PUBLIC_API_URL: '' # To be passed at build time
  _IMAGE_NAME: ''
options:
  logging: CLOUD_LOGGING_ONLY
images:
  - '${_IMAGE_NAME}'
